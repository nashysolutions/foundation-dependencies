# Continuous integration for foundation-dependencies.
#
# The point of this file is narrow and worth stating, because it is the thing
# that erodes first: every gate here exists so that some claim the repository
# makes can fail out loud when it stops being true. A job that cannot fail is
# worse than no job, because it reads as evidence.
#
# Four decisions are load-bearing. Please read them before editing.
#
# 1. No caching, anywhere.
#    SwiftPM does not always rebuild when only a `-Xswiftc` flag changes, so a
#    strict-concurrency build that starts from a warm `.build` can print
#    nothing and exit zero while checking nothing at all. That was measured on
#    this package, not assumed. Every job here starts from a fresh runner with
#    no `.build` directory, which is what makes the strict job's silence mean
#    something. A full cold build of this package takes about fifteen seconds,
#    so the cache would buy nothing and cost the only gate that catches a
#    whole class of concurrency defect.
#
# 2. The strict-concurrency build is its own job, not a second step.
#    Two steps in one job share a `.build` directory, which reintroduces the
#    problem above the moment somebody reorders them. A separate job cannot
#    share build state with another by construction. `swift package clean` is
#    run inside it anyway, so that adding a cache later degrades the job to
#    merely slow rather than silently vacuous.
#
# 3. The runner image is pinned; the Xcode inside it is chosen by measurement.
#    `macos-latest` migrates between images without a commit, which turns a
#    toolchain change into an unexplained red build on an untouched branch, so
#    the image label is pinned. The image's *default* Xcode is not good enough
#    on its own: this package's test suite needs Swift 6.2 for Swift Testing's
#    exit tests, and macos-15 defaults to 6.1.2, where the suite does not
#    compile and says so in thirty lines of macro errors that never mention the
#    version. `select-swift-toolchain` picks the newest installed Xcode that
#    clears the floor and fails with one sentence naming the requirement if
#    none does. Selecting by measured version rather than by a hardcoded
#    `/Applications/Xcode_*` path means the workflow survives the image
#    relabelling its Xcodes, which a path does not.
#
# 4. SwiftLint is pinned by version and verified by checksum.
#    An unpinned linter turns somebody else's release into a red build on a
#    repository nobody touched. The version below is the one the rule set in
#    `.swiftlint.yml` was measured against.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SWIFTLINT_VERSION: "0.63.2"
  SWIFTLINT_SHA256: "c59a405c85f95b92ced677a500804e081596a4cae4a6a485af76065557d6ed29"

jobs:

  build-and-test:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the toolchain
        uses: ./.github/actions/select-swift-toolchain

      - name: Build
        run: swift build

      - name: Test
        run: swift test 2>&1 | tee test.log

      - name: Assert the suite is not empty
        # `swift test` prints a passing summary for a run of zero tests, so a
        # suite that silently stopped being discovered reads as success. This
        # is not hypothetical on this package: a `--filter` written against a
        # `@Test` display name selects nothing and prints
        # `Test run with 0 tests in 0 suites passed`. Asserting the count is
        # non-zero costs nothing and removes the one way this job can lie.
        #
        # The count is deliberately not pinned to a number. A gate that fails
        # when a test is added trains people to edit the gate.
        run: |
          count=$(sed -n 's/.*Test run with \([0-9][0-9]*\) tests.*/\1/p' test.log | tail -1)
          if [ -z "$count" ] || [ "$count" -eq 0 ]; then
            echo "::error::swift test reported no tests. The suite is not being discovered."
            exit 1
          fi
          echo "$count tests ran."

  strict-concurrency:
    name: Strict concurrency
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the toolchain
        uses: ./.github/actions/select-swift-toolchain

      # A no-op on a fresh runner. It is here so that this job stays honest if
      # a future change adds caching to the workflow: see note 2 at the top.
      - name: Guarantee a cold build
        run: swift package clean

      - name: Build with complete concurrency checking
        # `--build-tests` because the test target is source in this repository
        # too, and a data race in a test is a flaky suite rather than a
        # harmless one.
        run: swift build --build-tests -Xswiftc -strict-concurrency=complete 2>&1 | tee strict.log

      - name: Assert no concurrency diagnostics in this package
        # Counting `warning:` occurrences directly over-reports: the compiler
        # repeats the message on the caret continuation line, so one unique
        # diagnostic reads as four. Only lines that begin with an absolute
        # path are counted, which is the diagnostic's own first line, and the
        # result is de-duplicated.
        #
        # `Scripts/check-documentation-examples.swift` filters the same way for
        # the same reason, and says so. Change one and read the other.
        #
        # `-Xswiftc` reaches every target in the graph, dependencies included.
        # A warning in swift-dependencies is real information but it is not a
        # defect in this package and cannot be fixed here, so it is reported
        # and not gated on.
        run: |
          grep -E "^/.*:[0-9]+:[0-9]+: (warning|error): " strict.log | sort -u > all-diagnostics.txt || true
          grep -F -e "$PWD/Sources/" -e "$PWD/Tests/" all-diagnostics.txt > own-diagnostics.txt || true

          echo "Diagnostics across the whole build graph, dependencies included:"
          cat all-diagnostics.txt

          count=$(wc -l < own-diagnostics.txt | tr -d ' ')
          if [ "$count" -ne 0 ]; then
            echo "::error::$count strict-concurrency diagnostic(s) in this package's own sources."
            cat own-diagnostics.txt
            exit 1
          fi
          echo "No strict-concurrency diagnostics in Sources/ or Tests/."

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        # Downloaded rather than taken from the runner image, whose SwiftLint
        # floats with the image. The checksum is the release artefact's, so a
        # replaced asset fails here rather than changing what "zero
        # violations" means.
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" version

      - name: Lint
        # No path argument: `.swiftlint.yml` carries `included`, and passing a
        # path here would put the gate's scope in two places that can disagree.
        # `--strict` promotes every violation to an error, which makes the gate
        # "zero violations" without parsing a count out of the output.
        #
        # `swiftlint lint --path <dir>` was removed in SwiftLint 0.63 and exits
        # 64 with `Unknown option`, which reads like a lint failure rather than
        # a broken command. Do not reintroduce it.
        run: |
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict

  documentation-examples:
    name: Documentation examples
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the toolchain
        uses: ./.github/actions/select-swift-toolchain

      - name: Type-check every Swift fence in the README and the DocC articles
        # See Scripts/check-documentation-examples.swift for what this does and
        # which snippets are deliberately exempt.
        run: swift Scripts/check-documentation-examples.swift

  platforms:
    name: Compile for ${{ matrix.platform }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS]
    steps:
      - uses: actions/checkout@v4

      - name: Select the toolchain
        uses: ./.github/actions/select-swift-toolchain

      - name: Record the Xcode
        run: xcodebuild -version

      - name: Build
        # Generic destinations, so no simulator is booted and no device is
        # needed. This compiles rather than runs, which is the whole point: the
        # `#if canImport(UIKit)` branch in ImageAsset.swift is never compiled by
        # the macOS build, so without this job that code could stop compiling
        # and every other gate would stay green.
        #
        # macOS is absent here because `build-and-test` already covers it, and
        # covers it better by running the suite on it.
        run: |
          xcodebuild build \
            -scheme foundation-dependencies \
            -destination "generic/platform=${{ matrix.platform }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipMacroValidation \
            -quiet
          echo "Compiled for ${{ matrix.platform }}."
